site_name: ML4SE-toolkit
site_description: Primitives for turning source code into machine-learning examples.
site_url: https://jkatzy.github.io/ML4SE-toolkit/
repo_url: https://github.com/jkatzy/ML4SE-toolkit
edit_uri: edit/dev/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Comments:
      - Extraction and cleaning: comment_extractor.md
      - Cleaning policy: comment_cleaning_policy.md
  - Input formatting:
      - Model input formats: input_formatting.md
  - Datasets:
      - Chunked datasets: chunked_datasets.md
  - Membership inference:
      - Module guide: membership_inference.md
  - Reproduction reports:
      - Studies: reproduction_reports/index.md
      - Loss (CSF 2018): reproduction_reports/loss.md
      - PAC (Findings of ACL 2024): reproduction_reports/pac.md
      - AST-PAC (FSE Companion 2026):
          - Paper report: reproduction_reports/ast_pac.md
          - Earlier four-model benchmark: reproduction_reports/full_benchmark.md
          - Archived-score comparison: reproduction_reports/archived_scores.md
  - Architecture: architecture.md
  - Git workflow: git_workflow.md

# Development-only guides live on dev and stay out of the published site.
exclude_docs: |
  comment_research/
  comment_testing/

validation:
  anchors: warn
