[build-system]
requires = ["setuptools==81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml4setk"
version = "0.0.2"
authors = [
  { name="Jonathan Katzy", email="J.B.Katzy@TUDelft.nl" },
]
description = "A package aimed at implementing core functionality for ML4SE to simplify and standardize research"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["machine learning", "software engineering", "code comments", "fill-in-the-middle"]
dependencies = [
    "regex>=2026.1.15",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]

[project.optional-dependencies]
treesitter = [
    "tree-sitter>=0.21.3,<0.22",
    "tree-sitter-languages>=1.10.2,<2",
]
datasets = [
    "huggingface_hub>=0.30",
    "pyarrow>=17",
]
torch = [
    "torch>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/jkatzy/ML4SE-toolkit"
Documentation = "https://jkatzy.github.io/ML4SE-toolkit/"
Issues = "https://github.com/jkatzy/ML4SE-toolkit/issues"
[dependency-groups]
dev = [
    "pytest==8.4.2; python_full_version == '3.9.*'",
    "pytest==9.0.2; python_full_version == '3.10.*'",
    "pytest==9.0.2; python_full_version >= '3.11'",
    "pytest-cov==7.1.0; python_full_version == '3.9.*'",
    "pytest-cov==7.1.0; python_full_version == '3.10.*'",
    "pytest-cov==7.1.0; python_full_version >= '3.11'",
    "ruff==0.15.8",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml4setk*"]
# The EBNF tree is a set of repository scripts, not importable package modules.
exclude = ["ml4setk.EBNF*"]

[tool.setuptools.package-data]
ml4setk = ["Comment_util/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast deterministic unit coverage for core modules",
    "integration: checks that exercise multiple modules together",
    "optional_dependency: tests that require optional extras",
]
addopts = [
    "--strict-markers",
    "--cov=ml4setk",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]
# Legacy EBNF utilities include bundled and generated code with a separate baseline.
extend-exclude = ["src/ml4setk/EBNF"]

[tool.ruff.format]
# Fixture sources are byte-exact parser inputs, not maintained code.
exclude = ["tests/fixtures/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
